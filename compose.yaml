services:
  tui_tcp_chat:
    build:
      context: .
      dockerfile: apps/tui_tcp_chat/Dockerfile
    image: ai-training-go/tui_tcp_chat
    ports:
      # host 9001 -> container 9000: host port 9000 is already bound by an
      # unrelated local container (portainer) on this dev machine.
      - "9001:9000"
